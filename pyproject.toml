[project]
name = "triage-laudos"
version = "0.1.0"
description = "Sistema tecnico de triagem de textos com inferencia auditavel"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "joblib>=1.4,<2.0",
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.9,<3.0",
    "scikit-learn>=1.5,<1.7",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "dvc[s3]>=3.0,<4.0",
    "httpx>=0.27,<1.0",
    "jsonschema>=4.23,<5.0",
    "openapi-spec-validator>=0.7,<0.9",
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.6,<1.0",
]
airflow = [
    "apache-airflow>=2.9,<3.0",
    "onnx>=1.16,<2.0",
    "onnxconverter-common>=1.14,<2.0",
    "skl2onnx>=1.17,<2.0",
]

[project.scripts]
train = "triage.training.train:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["triage"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.uv]
package = true
