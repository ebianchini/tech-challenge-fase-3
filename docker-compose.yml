# Default stack: API, Prometheus and Grafana. Enable Airflow with --profile airflow.
x-logging: &local-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-airflow-common: &airflow-common
  profiles: [airflow]
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: triage-airflow:local
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow-local-demo}@postgres/airflow
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-airflow-local-demo-web-secret}
    PYTHONPATH: /opt/airflow:/opt/airflow/src
    TRIAGE_PROJECT_ROOT: /opt/airflow
    TRIAGE_DATA_PATH: /opt/airflow/data/raw/medical_tc_train.csv
    TRIAGE_RUN_ROOT: /opt/airflow/artifacts/retraining
    TRIAGE_REGISTRY_ROOT: /opt/airflow/models/registry
    TRIAGE_PARAMS_PATH: /opt/airflow/params.yaml
    TRIAGE_RETRAIN_SCHEDULE: ${TRIAGE_RETRAIN_SCHEDULE:-}
    TRIAGE_TASK_TIMEOUT_MINUTES: "30"
    TRIAGE_TASK_RETRIES: "2"
  volumes:
    - type: bind
      source: ./dags
      target: /opt/airflow/dags
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./src
      target: /opt/airflow/src
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./params.yaml
      target: /opt/airflow/params.yaml
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./data
      target: /opt/airflow/data
      read_only: true
      bind:
        create_host_path: false
    - airflow-logs:/opt/airflow/logs
    - airflow-artifacts:/opt/airflow/artifacts/retraining
    - airflow-model-registry:/opt/airflow/models/registry
  networks:
    - airflow-backend
  depends_on:
    postgres:
      condition: service_healthy
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *local-logging

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TRIAGE_MODEL_SOURCE: demo
    image: ${TRIAGE_API_IMAGE:-triage-laudos:local}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      - api-internal
      - api-access
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3));
          assert r.get('status')=='ok' and r.get('model_loaded') is True
          and r.get('preprocessor_loaded') is True
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *local-logging
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - type: bind
        source: ./monitoring/prometheus
        target: /etc/prometheus
        read_only: true
        bind:
          create_host_path: false
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - api-internal
      - observability
    depends_on:
      # Keep collecting failed readiness and availability signals during API failures.
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://127.0.0.1:9090"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *local-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-triage-local-demo}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/triage-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *local-logging
    restart: unless-stopped

  postgres:
    profiles: [airflow]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow-local-demo}
      POSTGRES_DB: airflow
    volumes:
      - airflow-metadata:/var/lib/postgresql/data
    networks:
      - airflow-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *local-logging
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow-local-demo}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    command: ["python", "/opt/airflow/scripts/init_airflow.py"]
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: ["airflow", "scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$HOSTNAME\""]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow-common
    command: ["airflow", "webserver"]
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-scheduler:
        condition: service_healthy
    networks:
      - airflow-backend
      - airflow-access
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          r=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5));
          assert r['metadatabase']['status']=='healthy'
          and r['scheduler']['status']=='healthy'
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  airflow-metadata:
  airflow-logs:
  airflow-artifacts:
  airflow-model-registry:

networks:
  api-internal:
    driver: bridge
    internal: true
  api-access:
    driver: bridge
  observability:
    driver: bridge
  airflow-backend:
    driver: bridge
    internal: true
  airflow-access:
    driver: bridge
